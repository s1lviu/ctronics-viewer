name: Native release builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: '0.1.0'

permissions:
  contents: read

env:
  RELEASE_VERSION: '${{ inputs.version }}'
  MACOSX_DEPLOYMENT_TARGET: '11.0'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python buildtools/fetch_media.py
      - run: python buildtools/source_archive.py "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: corresponding-source
          path: dist/*-corresponding-source.tar.gz
          if-no-files-found: error
          compression-level: 0

  native:
    name: '${{ matrix.target }}'
    runs-on: '${{ matrix.runner }}'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, target: windows-x86_64}
          - {runner: ubuntu-22.04, target: linux-x86_64}
          - {runner: macos-15, target: macos-arm64}
          - {runner: macos-15-intel, target: macos-x86_64}
    env:
      TARGET: '${{ matrix.target }}'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Fetch verified media sources
        run: python buildtools/fetch_media.py
      - name: Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config nasm
      - name: macOS toolchain
        if: runner.os == 'macOS'
        run: brew install nasm pkgconf
      - name: Windows toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: make diffutils nasm mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
      - name: Build media on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash buildtools/build_media.sh
      - name: Build media on macOS/Linux
        if: runner.os != 'Windows'
        shell: bash
        run: bash buildtools/build_media.sh
      - name: Protocol and packaging unit tests
        run: python -m unittest test_protocol test_launcher test_bundle -v
      - name: Freeze application
        shell: bash
        run: python buildtools/bundle.py "$RELEASE_VERSION" "$TARGET"
      - name: Archive application
        shell: bash
        run: python buildtools/archive_bundle.py "dist/ctronics-viewer-$RELEASE_VERSION-$TARGET"
      - name: Test exact release archive without Python/FFmpeg on PATH
        shell: bash
        run: |
          archive="dist/ctronics-viewer-$RELEASE_VERSION-$TARGET.zip"
          if [ "$TARGET" = linux-x86_64 ]; then
            archive="dist/ctronics-viewer-$RELEASE_VERSION-$TARGET.tar.gz"
          fi
          python buildtools/smoke_bundle.py "$archive"
      - uses: actions/upload-artifact@v7
        with:
          name: '${{ matrix.target }}'
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
